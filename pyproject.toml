[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hedgebot"
version = "0.1.0"
description = "Arcus <-> Hyperliquid HIP-3 (trade.xyz / Entropy) delta-neutral points farming bot"
requires-python = ">=3.11"
dependencies = [
    "hyperliquid-python-sdk==0.24.0",
    "eth-account>=0.13",
    "cryptography>=42",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hedgebot = "hedgebot.cli:main"

[tool.setuptools.packages.find]
include = ["hedgebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
