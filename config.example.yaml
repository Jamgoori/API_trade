# hedgebot 설정 예시 (Entropy ⇄ trade.xyz). config.yaml 로 복사해서 수정하세요 (config.yaml 은 git 에 올라가지 않습니다).
#   cp config.example.yaml config.yaml
#
# 구조: 같은 종목을 Entropy(hl:io) 와 trade.xyz(hl:xyz) 에 같은 수량, 반대 방향으로 잡습니다.
#       Entropy 쪽은 메이커(호가에 걸어서 체결), trade.xyz 쪽은 체결 즉시 반대로 잡는 헤지입니다.
#       같은 종목끼리라 가격 위험이 거의 없고, Entropy OI·거래량이 쌓입니다. Arcus 는 쓰지 않습니다.
#
#   각 거래소 안에서도 롱·숏이 섞이게 두 종목씩 묶어 같이 방향을 정합니다(direction_group).
#     mem-us:  Entropy  SNDK 롱 + DRAM 숏   /  trade.xyz  SNDK 숏 + DRAM 롱   (또는 전부 반대)
#     mem-kr:  Entropy  SKHX 롱 + EWY 숏    /  trade.xyz  SKHX 숏 + EWY 롱    (또는 전부 반대)
#   그래서 한 거래소의 잔고는 업종 전체가 아니라 두 종목의 차이만큼만 움직이고, 거래소 간 이체가 드뭅니다.
#
#   3일마다(66~78시간, 미국 정규장 시간에) 전부 닫고 다시 쌓습니다. 그 사이엔 보유만 합니다.

mode: paper            # paper(실시세 모의) | testnet | live

# 크기의 1배 기준 = 각 거래소 잔고 (paper 에서는 모의 잔고). 두 거래소에 같은 금액을 두세요.
# 아래 페어 합계는 거래소마다 $36k = 각 잔고의 4배 (두 다리가 서로 헤지라 실제 가격 위험은 거의 없음).
# 잔고가 늘거나 줄면 같은 배수로 자동 조정됩니다(sizing).
capital:
  hl:io: 9000          # USDC, Hyperliquid 의 Entropy(io) 거래소 잔고
  hl:xyz: 9000         # USDC, Hyperliquid 의 trade.xyz 거래소 잔고

# Hyperliquid 계정은 Standard(수동) 모드여야 합니다 (통합 계정이면 봇이 시작을 거부). 확인: hedgebot hl-mode
hyperliquid:
  dexes: [io, xyz]
  base_maker_fee: 0.00015  # 본인 HL 수수료 등급 (HIP-3 배수 적용 전). 네 종목 모두 growth mode(90% 할인)
  base_taker_fee: 0.00045
  margin_mode: cross   # 교차 가능한 종목은 교차, 격리 전용(Entropy SKHX·EWY, trade.xyz EWY)은 자동으로 격리

# 페어: maker = Entropy (호가가 넓어서 메이커로 거는 쪽이 싸고, Entropy 거래량은 전부 메이커 거래량),
#       hedge = trade.xyz (호가가 훨씬 두꺼움: SNDK 0.1bp, EWY 0.7bp).
# notional_usd = 한쪽 다리 금액 (반대쪽도 같은 수량). direction_group 안의 금액 비율은 두 종목의 변동성 비율
#   (변동성이 큰 쪽을 작게)로 맞춰서 한 거래소 안의 롱·숏이 비슷하게 움직이게 합니다. `hedgebot pairs` 로 확인.
# group_side: 묶음의 방향이 +1 일 때 이 페어의 Entropy 다리 방향 (+1 롱 / -1 숏). 묶음 방향은 펀딩으로 정합니다.
# leverage: 교차 다리는 증거금 사용량만 정하고(10배 = 10%), 격리 다리는 청산까지 거리를 정합니다(3배 ≈ 30%).
# 한 종목은 한 페어에만 넣으세요.
pairs:
  - name: SNDK
    group: mem-us
    maker: {venue: "hl:io", symbol: "io:SNDK"}
    hedge: {venue: "hl:xyz", symbol: "xyz:SNDK"}
    notional_usd: 9600           # SNDK 변동성이 DRAM 의 약 1.25배 -> DRAM 의 0.8배 금액
    leverage: 10                 # 양쪽 교차증거금
    direction: auto
    direction_group: mem-us
    group_side: 1

  - name: DRAM
    group: mem-us
    maker: {venue: "hl:io", symbol: "io:DRAM"}
    hedge: {venue: "hl:xyz", symbol: "xyz:DRAM"}
    notional_usd: 12000
    leverage: 10                 # 양쪽 교차증거금
    direction: auto
    direction_group: mem-us
    group_side: -1

  - name: SKHX
    group: mem-kr
    maker: {venue: "hl:io", symbol: "io:SKHX"}
    hedge: {venue: "hl:xyz", symbol: "xyz:SKHX"}
    notional_usd: 5600           # SKHX 변동성이 EWY 의 약 1.6배 -> EWY 가 SKHX 의 1.6배 금액
    leverage: 3                  # Entropy 쪽이 격리 전용: 약 30% 움직여야 청산
    direction: auto
    direction_group: mem-kr
    group_side: 1

  - name: EWY
    group: mem-kr
    maker: {venue: "hl:io", symbol: "io:EWY"}
    hedge: {venue: "hl:xyz", symbol: "xyz:EWY"}
    notional_usd: 8960
    leverage: 3                  # 양쪽 다 격리 전용
    direction: auto
    direction_group: mem-kr
    group_side: -1

strategy:
  clip_usd_min: 1000       # 한 번에 거는 메이커 주문 크기 (랜덤)
  clip_usd_max: 2500
  maker_price: improve     # improve: 스프레드가 3틱 이상이면 1틱 안쪽에 걸어 먼저 체결 (Entropy 호가가 넓음) | join
  reprice_after_s: 15
  clip_timeout_s: 900
  # 3일에 한 번: 66~78시간 보유 후, 미국 정규장(09:30~16:00 ET) 시간에 100% 닫고 바로 다시 쌓습니다.
  # 전부 닫았다 다시 쌓으면 (1) 거래량이 생기고 (2) 거래소 간 가격 차이(베이시스)를 정리하고
  # (3) 격리증거금이 초기화되고 (4) 묶음별로 펀딩을 받는 방향으로 다시 정합니다.
  min_hold_h: 66
  max_hold_h: 78
  rotation_fraction_min: 1.0
  rotation_fraction_max: 1.0
  rotate_when: us_session  # us_session | any  (off_hours 는 Arcus 용이라 Entropy 에서는 회전하지 않음)
  max_daily_cost_usd: 40   # 하루 수수료+슬리피지 예산 (크기 배수만큼 같이 늘어남). 넘으면 회전을 다음날로
  max_maker_spread_bps: 25
  max_hedge_spread_bps: 20
  basis_guard_bps: 8       # Entropy 와 trade.xyz 가격 차이가 평소보다 8bp 이상 불리하면 대기
  min_carry_edge_apr: 0.02 # 묶음 전체로 연 2% 이상 펀딩 차이가 있으면 펀딩 받는 방향
  flip_carry_apr: 0.02     # 회전할 때 반대 방향이 연 2% 이상 유리하면 묶음 전체 방향 전환 (어차피 전부 닫으므로 추가 비용 없음)
  funding_window_h: 168    # 방향 판단에 쓰는 펀딩 평균 기간
  target_tolerance: 0.08

execution:
  # taker: Entropy 메이커가 체결되면 즉시 trade.xyz 에서 테이커로 헤지 (한쪽만 잡힌 시간 최소).
  #        trade.xyz 호가가 매우 촘촘해서 메이커로 먼저 걸어도(passive_first) 백테스트상 비용이 같습니다.
  hedge_mode: taker
  passive_hedge_timeout_s: 20
  passive_hedge_max_adverse_bps: 3
  passive_hedge_requote_s: 4
  hedge_slippage_bps: [5, 15, 40]
  urgent_slippage_bps: 30
  imbalance_tolerance_usd: 40       # 두 다리 차이가 이 금액을 넘으면
  imbalance_grace_s: 8              # 이 시간 확인 후 큰 쪽을 줄여서 맞춤
  ioc_confirm_timeout_s: 6

risk:
  margin_ratio_warn: 3.0            # 교차 계정 자산/유지증거금 비율 경고 (이체 금액 안내)
  margin_ratio_critical: 1.7        # 이 밑이면 모든 페어 30% 축소
  isolated_liq_buffer_warn_pct: 8   # 격리 다리(Entropy SKHX·EWY, trade.xyz EWY) 청산가까지 거리
  isolated_liq_buffer_critical_pct: 4
  derisk_fraction: 0.3
  backstop_enabled: true            # 거래소에 걸어 두는 손절 (봇이 꺼져 있어도 작동)
  backstop_margin_ratio: 1.25
  backstop_isolated_buffer_pct: 2   # 격리 다리는 청산가 2% 앞에 손절
  backstop_refresh_s: 60
  stop_cooldown_h: 6                # 한쪽 다리가 손절/청산되면 반대쪽(다른 거래소)도 바로 정리 후 6시간 쉬고 재진입
  isolated_topup_enabled: true      # 격리 다리가 청산가 8% 이내면 계정 여유 잔고로 증거금 보충
  isolated_topup_target_pct: 15
  max_account_leverage: 6           # 거래소별 명목가 / 자산 상한 (기본 구성은 4배, 잔고가 벌어져도 다시 쌓을 여유)
  max_daily_loss_pct: 2             # 두 거래소 합계 손실이 하루 2% 넘으면 그날 신규 진입·회전 중단 (포지션은 유지)
  # 손실 한도: 두 거래소 합계가 최고점 대비 6% 빠지면 알림, 12% 빠지면 모든 페어를 닫고 멈춤.
  # 헤지가 정상이면 합계는 거의 안 움직이므로(백테스트 최대 1.5%), 여기까지 오면 뭔가 고장난 것입니다.
  # 다시 시작하려면 `hedgebot resume` 후 재시작. 입금·출금·거래소 간 이체는 손익으로 치지 않습니다.
  drawdown_warn_pct: 6
  max_drawdown_pct: 12
  stale_data_s: 20
  max_consecutive_errors: 5

poll:
  active_s: 1.0
  idle_s: 3.0
  markets_s: 60
  account_s: 5
  snapshot_s: 60
  funding_refresh_s: 3600

paper:
  maker_fill: through  # through: 가격이 내 호가를 뚫고 지나가야 체결(보수적) | touch: 닿으면 체결(낙관적)
  state_dir: data/paper

# 거래소 간 이체 알림 (돈은 직접 옮기세요. 봇 키는 이체 권한이 없습니다)
# 72시간마다 두 거래소 잔고를 합쳐 capital 비율(1:1)로 다시 나눈 금액이 $1,000 이상일 때만 텔레그램으로 알립니다.
# 같은 종목 헤지라 한쪽이 벌면 다른 쪽이 잃습니다. 백테스트(112일)에서 이체가 필요했던 건 2번입니다.
# Hyperliquid 웹에서 trade.xyz <-> Entropy 사이로 USDC 를 옮기면 됩니다. `hedgebot rebalance` 로 언제든 확인.
rebalance:
  enabled: true
  every_h: 72
  venues: ["hl:io", "hl:xyz"]
  min_transfer_usd: 1000

# 잔고가 늘거나 줄면 포지션 크기 자동 조정: 배수 = 두 거래소 잔고 합계 / capital 합계
# 예) 합계 $36k 면 모든 페어가 2배. 입금은 30분, 출금은 6시간 유지되면 반영. 두 거래소에 반씩 넣으세요.
sizing:
  scale_with_equity: true
  check_min: 5
  min_change_pct: 10
  grow_after_min: 30
  shrink_after_h: 6
  min_scale: 0.25
  max_scale: 10

journal_path: data/journal.sqlite
log_dir: data/logs
